name: Deploy SchoolDesk student email function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/schooldesk-send-student-login-email/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-function.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy student email function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy schooldesk-send-student-login-email --project-ref zyksfbdwdtpjbcuyejkd --yes
